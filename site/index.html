<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Devorando ENEM</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta property="og:title" content="Devorando ENEM">
<meta property="og:description" content="Questões do ENEM 2019–2025 com explicação de cada alternativa, simulados e acompanhamento de desempenho.">
<meta property="og:image" content="https://devorando-enem.web.app/icon-512.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1f5f4a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Devorando ENEM">
<link rel="stylesheet" href="style.css?v=42e9b308">
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<script defer src="data.js?v=ae022b46"></script>
<script defer src="explicacoes.js?v=5484bc27"></script>
<script defer src="meta.js?v=686eae73"></script>
<script defer src="config.js?v=3510b160"></script>
<script defer src="app.js?v=5c6f205e"></script>
<script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script defer src="nuvem.js?v=6b4f6b39"></script>
<script defer src="admin.js?v=c533f5a8"></script>
<script defer src="redacao.js?v=3c112b06"></script>
</head>
<body>
<header class="top">
  <div class="top-in">
    <h1><img class="logo" src="logo.svg" alt="" width="34" height="34">Devorando <span>ENEM</span></h1>
    <nav>
      <button id="tab-simulado" class="tab on">Simulado</button>
      <button id="tab-stats" class="tab">Desempenho</button>
      <button id="tab-redacao" class="tab" hidden>Redação</button>
      <button id="tab-config" class="tab">Configurações</button>
      <button id="tab-alunos" class="tab" hidden>Administração</button>
    </nav>
    <div id="user-area" class="user-area" hidden></div>
  </div>
</header>

<main class="layout">
  <aside id="filtros" class="filtros" style="display:none">
    <h2>Filtros</h2>
    <fieldset>
      <legend>Ano</legend>
      <div id="f-anos" class="chips"></div>
    </fieldset>
    <fieldset>
      <legend>Matéria</legend>
      <div id="f-mats" class="chips"></div>
    </fieldset>
    <fieldset>
      <legend>Assunto</legend>
      <select id="f-assunto"><option value="">Todos os assuntos</option></select>
    </fieldset>
    <fieldset>
      <legend>Situação</legend>
      <select id="f-status">
        <option value="todas">Todas</option>
        <option value="novas">Ainda não respondidas</option>
        <option value="erradas">Que errei</option>
        <option value="certas">Que acertei</option>
        <option value="marcadas">Marcadas para revisar</option>
      </select>
    </fieldset>
    <fieldset>
      <legend>Língua estrangeira (Q. 1–5)</legend>
      <select id="f-lingua">
        <option value="ambas">Inglês e Espanhol</option>
        <option value="Inglês">Só Inglês</option>
        <option value="Espanhol">Só Espanhol</option>
        <option value="nenhuma">Ocultar</option>
      </select>
    </fieldset>
    <fieldset>
      <legend>Buscar no enunciado</legend>
      <input id="f-busca" type="search" placeholder="ex.: Revolução Industrial">
    </fieldset>
    <label class="check"><input id="f-embaralhar" type="checkbox"> Ordem aleatória</label>
    <p id="f-resumo" class="muted"></p>
    <button id="f-limpar" class="ghost">Limpar filtros</button>
  </aside>

  <section id="painel-simulado" class="painel"></section>

  <section id="painel-praticar" class="painel" hidden>
    <div id="sim-bar" class="sim-bar" hidden>
      <div><b id="sim-nome"></b> <span id="sim-prog" class="muted"></span></div>
      <div class="sim-acoes">
        <button id="sim-pausa" class="ghost" type="button">⏸ Pausar</button>
        <button id="sim-fim" class="btn" type="button">Finalizar</button>
        <button id="sim-sair" class="ghost" type="button">Voltar ao início</button>
      </div>
    </div>
    <div class="nav-q">
      <button id="prev" class="ghost" title="Anterior (←)">←</button>
      <div id="posicao" class="posicao"></div>
      <button id="next" class="ghost" title="Próxima (→)">→</button>
    </div>
    <div id="paleta" class="paleta" aria-label="Navegação por questão"></div>
    <article id="questao" class="questao" aria-live="polite"></article>
  </section>

  <section id="painel-stats" class="painel" hidden></section>
  <section id="painel-redacao" class="painel" hidden></section>
  <section id="painel-config" class="painel" hidden></section>
  <section id="painel-alunos" class="painel" hidden></section>
</main>

<footer class="rodape">
  Provas e gabaritos oficiais do <a href="https://www.gov.br/inep/pt-br/areas-de-atuacao/avaliacao-e-exames-educacionais/enem/provas-e-gabaritos" target="_blank" rel="noopener">INEP</a> (1ª aplicação, caderno azul; em 2019, 2º dia no caderno amarelo).
  Site independente, sem vínculo com o INEP.
</footer>

<script>if ("serviceWorker" in navigator && location.protocol !== "file:") window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });</script>
</body>
</html>
